<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhishek Jha — Data Analyst & ML Engineer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0f2044;
            --navy-mid: #1e3a6e;
            --sky: #3b7dd8;
            --sky-light: #6fa3e8;
            --amber: #e8943a;
            --amber-light: #f5c080;
            --cream: #faf8f4;
            --cream-mid: #f2ede4;
            --white: #ffffff;
            --text: #1a2030;
            --text-mid: #3a4660;
            --text-dim: #7a869a;
            --border: rgba(15,32,68,0.1);
            --card-shadow: 0 4px 30px rgba(15,32,68,0.08);
            --card-shadow-hover: 0 16px 60px rgba(15,32,68,0.16);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.6;
            cursor: none;
        }

        /* Noise texture overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        /* Decorative blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.12;
            z-index: 0;
            pointer-events: none;
        }
        .blob-1 { width: 700px; height: 700px; background: var(--sky); top: -200px; right: -200px; animation: blobDrift 25s ease-in-out infinite; }
        .blob-2 { width: 500px; height: 500px; background: var(--amber); bottom: -100px; left: -100px; animation: blobDrift 30s ease-in-out infinite reverse; }
        .blob-3 { width: 400px; height: 400px; background: var(--navy); top: 50%; left: 40%; animation: blobDrift 20s ease-in-out infinite 5s; }

        @keyframes blobDrift {
            0%, 100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(60px,-80px) scale(1.08); }
            66% { transform: translate(-50px,60px) scale(0.94); }
        }

        /* Floating dots decoration */
        .dot-grid {
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(15,32,68,0.07) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        /* ── NAV ── */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 0;
        }

        nav {
            background: rgba(250,248,244,0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 0.9rem 2rem;
            border-radius: 100px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 24px rgba(15,32,68,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--navy);
            letter-spacing: -0.5px;
        }
        .logo span { color: var(--amber); }

        .nav-links { display: flex; gap: 2rem; list-style: none; }
        .nav-links a {
            color: var(--text-mid);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: color 0.25s;
            letter-spacing: 0.01em;
        }
        .nav-links a:hover { color: var(--sky); }

        .nav-resume {
            padding: 0.55rem 1.4rem;
            background: var(--navy);
            color: var(--white) !important;
            border-radius: 100px;
            font-weight: 600 !important;
            transition: background 0.25s, transform 0.2s !important;
        }
        .nav-resume:hover { background: var(--sky) !important; color: var(--white) !important; transform: translateY(-1px); }

        /* ── HERO ── */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 6rem 0 4rem;
        }

        .hero-inner {
            display: grid;
            grid-template-columns: 1fr 420px;
            gap: 4rem;
            align-items: center;
        }

        .hero-content { animation: slideUp 0.9s ease-out both; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.2rem;
            background: rgba(59,125,216,0.1);
            border: 1px solid rgba(59,125,216,0.3);
            border-radius: 100px;
            color: var(--sky);
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 2rem;
            animation: slideUp 0.9s ease-out 0.1s both;
        }
        .badge-dot {
            width: 7px; height: 7px;
            background: var(--sky);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.5;transform:scale(1.4);} }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 900;
            line-height: 1.05;
            color: var(--navy);
            margin-bottom: 1rem;
            animation: slideUp 0.9s ease-out 0.2s both;
        }
        .hero h1 .highlight {
            background: linear-gradient(135deg, var(--sky), var(--amber));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-role {
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--text-dim);
            margin-bottom: 1.5rem;
            animation: slideUp 0.9s ease-out 0.3s both;
        }
        .hero-role strong { color: var(--text-mid); font-weight: 600; }

        .hero p {
            font-size: 1.05rem;
            color: var(--text-mid);
            line-height: 1.9;
            margin-bottom: 2.5rem;
            max-width: 540px;
            animation: slideUp 0.9s ease-out 0.4s both;
        }

        .hero-buttons {
            display: flex;
            gap: 1rem;
            animation: slideUp 0.9s ease-out 0.5s both;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 2rem;
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.93rem;
            transition: all 0.3s ease;
            border: none;
            cursor: none;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 0.01em;
        }
        .btn-primary {
            background: var(--navy);
            color: var(--white);
            box-shadow: 0 4px 20px rgba(15,32,68,0.25);
        }
        .btn-primary:hover { background: var(--sky); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(59,125,216,0.35); }
        .btn-secondary {
            background: var(--white);
            color: var(--navy);
            border: 1.5px solid var(--border);
            box-shadow: var(--card-shadow);
        }
        .btn-secondary:hover { border-color: var(--sky); color: var(--sky); transform: translateY(-2px); box-shadow: var(--card-shadow-hover); }
        .btn-amber {
            background: var(--amber);
            color: var(--white);
            box-shadow: 0 4px 20px rgba(232,148,58,0.35);
        }
        .btn-amber:hover { background: #d4812c; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(232,148,58,0.45); }

        .hero-contacts {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            margin-top: 2.5rem;
            animation: slideUp 0.9s ease-out 0.6s both;
        }
        .hero-contact-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            color: var(--text-dim);
            font-family: 'DM Mono', monospace;
        }
        .hero-contact-item .icon { color: var(--amber); }

        /* Hero Card */
        .hero-card {
            background: var(--white);
            border-radius: 28px;
            padding: 2.5rem;
            box-shadow: var(--card-shadow-hover);
            border: 1px solid var(--border);
            animation: slideUp 0.9s ease-out 0.3s both;
            position: relative;
            overflow: hidden;
        }
        .hero-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--sky), var(--amber));
        }
        .hero-card-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-dim);
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .stat-row { display: flex; flex-direction: column; gap: 1.2rem; }
        .stat-item { display: flex; flex-direction: column; gap: 0.2rem; }
        .stat-num {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--navy);
            line-height: 1;
        }
        .stat-label { font-size: 0.82rem; color: var(--text-dim); }
        .stat-divider { height: 1px; background: var(--border); }

        /* ── RESUME SECTION ── */
        .resume-section { padding: 5rem 0; }
        .resume-card {
            background: var(--navy);
            border-radius: 28px;
            padding: 3.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            position: relative;
            overflow: hidden;
        }
        .resume-card::before {
            content: '';
            position: absolute;
            top: -100px; right: -100px;
            width: 350px; height: 350px;
            border-radius: 50%;
            background: rgba(59,125,216,0.2);
        }
        .resume-card::after {
            content: '';
            position: absolute;
            bottom: -80px; left: 30%;
            width: 250px; height: 250px;
            border-radius: 50%;
            background: rgba(232,148,58,0.12);
        }
        .resume-text { position: relative; z-index: 2; }
        .resume-text h2 {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--white);
            margin-bottom: 0.75rem;
        }
        .resume-text p { color: rgba(255,255,255,0.65); font-size: 1rem; max-width: 480px; line-height: 1.8; }
        .resume-actions { display: flex; gap: 1rem; flex-wrap: wrap; position: relative; z-index: 2; }
        .btn-download {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 1rem 2.2rem;
            background: var(--amber);
            color: var(--white);
            border-radius: 100px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 6px 25px rgba(232,148,58,0.4);
        }
        .btn-download:hover { background: #d4812c; transform: translateY(-3px) scale(1.02); box-shadow: 0 12px 40px rgba(232,148,58,0.5); }
        .btn-view-resume {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 1rem 2rem;
            background: rgba(255,255,255,0.1);
            color: var(--white);
            border-radius: 100px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            border: 1.5px solid rgba(255,255,255,0.2);
        }
        .btn-view-resume:hover { background: rgba(255,255,255,0.2); transform: translateY(-2px); }
        .resume-file-info {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 1.2rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.45);
            font-family: 'DM Mono', monospace;
        }
        .file-badge {
            padding: 0.25rem 0.7rem;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            color: rgba(255,255,255,0.65);
        }

        /* ── SECTIONS ── */
        section { padding: 6rem 0; }

        .section-header { margin-bottom: 4rem; }
        .section-kicker {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--sky);
            margin-bottom: 0.75rem;
            font-family: 'DM Mono', monospace;
        }

        h2.section-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
            color: var(--navy);
            line-height: 1.1;
        }

        .section-desc { color: var(--text-dim); font-size: 1rem; margin-top: 0.75rem; max-width: 540px; }

        /* ── SKILLS ── */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5rem;
        }
        .skill-card {
            background: var(--white);
            border-radius: 20px;
            padding: 1.8rem;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }
        .skill-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(59,125,216,0.04), rgba(232,148,58,0.04));
            opacity: 0;
            transition: opacity 0.35s ease;
        }
        .skill-card:hover { transform: translateY(-6px); box-shadow: var(--card-shadow-hover); border-color: rgba(59,125,216,0.2); }
        .skill-card:hover::after { opacity: 1; }
        .skill-card-top {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.2rem;
        }
        .skill-icon {
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, rgba(59,125,216,0.12), rgba(232,148,58,0.08));
            border-radius: 10px;
            font-size: 1.1rem;
        }
        .skill-card h3 { font-size: 0.9rem; font-weight: 700; color: var(--navy); letter-spacing: 0.02em; }
        .skill-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .skill-tag {
            padding: 0.35rem 0.85rem;
            background: var(--cream-mid);
            border: 1px solid var(--border);
            border-radius: 100px;
            font-size: 0.8rem;
            color: var(--text-mid);
            font-weight: 500;
            transition: all 0.2s;
        }
        .skill-tag:hover { background: rgba(59,125,216,0.1); border-color: rgba(59,125,216,0.3); color: var(--sky); }

        /* ── TIMELINE ── */
        .timeline { max-width: 860px; position: relative; }
        .timeline::before {
            content: '';
            position: absolute;
            left: 0; top: 28px; bottom: 28px;
            width: 2px;
            background: linear-gradient(180deg, var(--sky), var(--amber));
            border-radius: 2px;
        }
        .timeline-item { padding-left: 2.5rem; margin-bottom: 2.5rem; position: relative; }
        .timeline-dot {
            position: absolute;
            left: -7px; top: 24px;
            width: 16px; height: 16px;
            background: var(--white);
            border: 3px solid var(--sky);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(59,125,216,0.12);
            transition: all 0.3s;
        }
        .timeline-item:hover .timeline-dot { border-color: var(--amber); box-shadow: 0 0 0 6px rgba(232,148,58,0.15); transform: scale(1.1); }
        .timeline-card {
            background: var(--white);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            transition: all 0.35s ease;
        }
        .timeline-card:hover { transform: translateX(6px); box-shadow: var(--card-shadow-hover); border-color: rgba(59,125,216,0.2); }
        .timeline-date {
            display: inline-block;
            padding: 0.25rem 0.9rem;
            background: rgba(59,125,216,0.08);
            border-radius: 100px;
            font-size: 0.78rem;
            color: var(--sky);
            font-weight: 600;
            font-family: 'DM Mono', monospace;
            margin-bottom: 1rem;
        }
        .timeline-card h3 { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; color: var(--navy); margin-bottom: 0.25rem; }
        .timeline-card h4 { font-size: 0.9rem; color: var(--text-dim); font-weight: 400; margin-bottom: 1rem; }
        .timeline-card .sub-label {
            font-size: 0.82rem; font-weight: 600; color: var(--sky); margin-bottom: 1rem; padding: 0.3rem 0.9rem; background: rgba(59,125,216,0.07); border-radius: 8px; display: inline-block;
        }
        .timeline-card ul { list-style: none; }
        .timeline-card li { padding: 0.45rem 0 0.45rem 1.5rem; position: relative; color: var(--text-mid); font-size: 0.91rem; border-bottom: 1px solid rgba(15,32,68,0.05); }
        .timeline-card li:last-child { border-bottom: none; }
        .timeline-card li::before { content: '→'; position: absolute; left: 0; color: var(--amber); font-size: 0.85rem; }
        .timeline-card li strong { color: var(--sky); }

        /* ── PROJECTS ── */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 1.8rem;
        }
        .project-card {
            background: var(--white);
            border-radius: 24px;
            padding: 2.2rem;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: none;
            position: relative;
            overflow: hidden;
        }
        .project-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--sky), var(--amber));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }
        .project-card:hover::before { transform: scaleX(1); }
        .project-card:hover { transform: translateY(-10px); box-shadow: var(--card-shadow-hover); border-color: rgba(59,125,216,0.2); }
        .project-type {
            display: inline-block;
            padding: 0.28rem 0.85rem;
            background: rgba(232,148,58,0.1);
            border: 1px solid rgba(232,148,58,0.3);
            border-radius: 100px;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--amber);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 1rem;
        }
        .project-card h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 0.85rem;
            line-height: 1.3;
        }
        .project-card p { color: var(--text-mid); font-size: 0.91rem; line-height: 1.75; margin-bottom: 1.5rem; }
        .tech-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .tech-tag {
            padding: 0.3rem 0.8rem;
            background: rgba(59,125,216,0.08);
            border-radius: 8px;
            font-size: 0.78rem;
            color: var(--sky);
            font-weight: 500;
            font-family: 'DM Mono', monospace;
        }
        .project-card-arrow {
            position: absolute;
            bottom: 1.5rem; right: 1.5rem;
            width: 36px; height: 36px;
            background: var(--cream);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem;
            color: var(--text-dim);
            transition: all 0.3s;
            border: 1px solid var(--border);
        }
        .project-card:hover .project-card-arrow { background: var(--navy); color: var(--white); transform: rotate(45deg); }

        /* ── EDUCATION ── */
        .edu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .edu-card {
            background: var(--white);
            border-radius: 24px;
            padding: 2.2rem;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            transition: all 0.35s ease;
            position: relative;
            overflow: hidden;
        }
        .edu-card::after {
            content: '';
            position: absolute;
            bottom: -20px; right: -20px;
            width: 100px; height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(59,125,216,0.06), rgba(232,148,58,0.06));
            transition: all 0.4s ease;
        }
        .edu-card:hover { transform: translateY(-6px); box-shadow: var(--card-shadow-hover); border-color: rgba(59,125,216,0.2); }
        .edu-card:hover::after { width: 180px; height: 180px; }
        .edu-icon { font-size: 2.2rem; margin-bottom: 1.2rem; display: block; }
        .edu-card h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--navy); margin-bottom: 0.4rem; line-height: 1.4; }
        .edu-card .institution { font-size: 0.88rem; color: var(--text-dim); margin-bottom: 1rem; }
        .edu-year { display: inline-block; padding: 0.28rem 0.9rem; background: rgba(59,125,216,0.08); border-radius: 100px; font-size: 0.78rem; color: var(--sky); font-weight: 600; font-family: 'DM Mono', monospace; }

        /* ── CTA ── */
        .cta-wrapper {
            background: linear-gradient(135deg, var(--cream-mid), var(--white));
            border-radius: 32px;
            padding: 5rem 4rem;
            text-align: center;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            position: relative;
            overflow: hidden;
        }
        .cta-wrapper::before {
            content: '';
            position: absolute;
            top: -80px; left: 50%;
            transform: translateX(-50%);
            width: 400px; height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59,125,216,0.08), transparent 70%);
        }
        .cta-wrapper h2 { font-family: 'Playfair Display', serif; font-size: 3rem; font-weight: 900; color: var(--navy); margin-bottom: 1.2rem; }
        .cta-wrapper p { color: var(--text-mid); font-size: 1.1rem; margin-bottom: 2.5rem; max-width: 520px; margin-left: auto; margin-right: auto; }
        .cta-buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

        /* ── FOOTER ── */
        footer { padding: 3rem 0; border-top: 1px solid var(--border); margin-top: 2rem; }
        .footer-inner { display: flex; justify-content: space-between; align-items: center; gap: 2rem; flex-wrap: wrap; }
        .footer-logo { font-family: 'Playfair Display', serif; font-size: 1.4rem; font-weight: 900; color: var(--navy); }
        .footer-logo span { color: var(--amber); }
        .social-links { display: flex; gap: 0.75rem; }
        .social-links a {
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            background: var(--white); border: 1px solid var(--border); border-radius: 50%; color: var(--text-mid);
            text-decoration: none; font-size: 0.9rem; transition: all 0.3s; font-family: 'DM Mono', monospace; font-weight: 500;
        }
        .social-links a:hover { background: var(--navy); color: var(--white); border-color: var(--navy); transform: translateY(-3px); box-shadow: 0 6px 20px rgba(15,32,68,0.2); }
        footer p { color: var(--text-dim); font-size: 0.82rem; font-family: 'DM Mono', monospace; }

        /* ── MODAL ── */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(15,32,68,0.6); z-index: 500;
            padding: 2rem; overflow-y: auto; backdrop-filter: blur(8px);
        }
        .modal-overlay.active { display: flex; align-items: flex-start; justify-content: center; }
        .modal {
            background: var(--white); border-radius: 28px; max-width: 780px; width: 100%; margin: auto;
            padding: 3rem; position: relative; animation: modalIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
            box-shadow: 0 40px 120px rgba(15,32,68,0.25); border: 1px solid var(--border);
        }
        .modal::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, var(--sky), var(--amber)); border-radius: 28px 28px 0 0;
        }
        @keyframes modalIn { from { opacity: 0; transform: translateY(30px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-close {
            position: absolute; top: 1.5rem; right: 1.5rem; background: var(--cream); border: 1px solid var(--border);
            color: var(--text-dim); width: 36px; height: 36px; border-radius: 50%; cursor: none; font-size: 0.9rem;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .modal-close:hover { background: var(--navy); color: var(--white); }
        .modal-project-type { margin-bottom: 1rem; }
        .modal h2 { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: var(--navy); margin-bottom: 1.5rem; }
        .modal-section-head {
            font-size: 0.72rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;
            color: var(--sky); margin: 2rem 0 0.75rem; padding-bottom: 0.5rem; border-bottom: 2px solid rgba(59,125,216,0.15);
            font-family: 'DM Mono', monospace;
        }
        .modal-text { color: var(--text-mid); font-size: 0.93rem; line-height: 1.8; }
        .modal-list { list-style: none; }
        .modal-list li { color: var(--text-mid); font-size: 0.91rem; padding: 0.5rem 0 0.5rem 1.5rem; position: relative; line-height: 1.7; border-bottom: 1px solid rgba(15,32,68,0.06); }
        .modal-list li::before { content: '→'; position: absolute; left: 0; color: var(--amber); }
        .result-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; margin: 1rem 0; }
        .result-box { background: var(--cream); border: 1px solid var(--border); border-radius: 16px; padding: 1.2rem; text-align: center; }
        .result-num { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--navy); font-weight: 700; display: block; }
        .result-label { font-size: 0.68rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; }

        /* ── SCROLL ANIMATIONS ── */
        [data-animate] { opacity: 0; transform: translateY(28px); transition: opacity 0.7s ease, transform 0.7s ease; }
        [data-animate].in-view { opacity: 1; transform: translateY(0); }

        [data-stagger] > * { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
        [data-stagger].in-view > *:nth-child(1) { opacity:1; transform:translateY(0); transition-delay: 0.05s; }
